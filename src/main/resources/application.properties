package com.samarth.snapdeal.controller;

import com.samarth.snapdeal.model.Job;
import com.samarth.snapdeal.service.SnapdealDataStore;
import org.springframework.http.ResponseEntity;
import org.springframework.web.bind.annotation.*;

import java.util.List;
import java.util.Map;

@RestController
@RequestMapping("/api")
@CrossOrigin(origins = "*")
public class JobController {

    private final SnapdealDataStore dataStore;

    public JobController(SnapdealDataStore dataStore) {
        this.dataStore = dataStore;
    }

    @GetMapping("/jobs")
    public List<Job> getJobs() {
        return dataStore.getAllJobs();
    }

    @PostMapping("/jobs")
    public ResponseEntity<?> createJob(@RequestBody Map<String, String> payload) {
        try {
            String title = payload.get("title");
            String company = payload.get("company");
            String location = payload.get("location");
            String type = payload.get("type");
            String salary = payload.get("salary");
            String description = payload.get("description");
            String postedBy = payload.get("postedBy");

            if (title == null || title.isBlank()) {
                return ResponseEntity.badRequest().body(Map.of("message", "Job title is required."));
            }
            if (company == null || company.isBlank()) {
                return ResponseEntity.badRequest().body(Map.of("message", "Company is required."));
            }
            if (location == null || location.isBlank()) {
                return ResponseEntity.badRequest().body(Map.of("message", "Location is required."));
            }
            if (type == null || type.isBlank()) {
                type = "Full Time";
            }
            if (salary == null || salary.isBlank()) {
                salary = "Not disclosed";
            }
            if (description == null || description.isBlank()) {
                description = "No description provided.";
            }
            if (postedBy == null || postedBy.isBlank()) {
                postedBy = "Snapdeal Admin";
            }

            Job job = dataStore.createJob(title, company, location, type, salary, description, postedBy);
            return ResponseEntity.ok(Map.of("message", "Job posted successfully.", "job", job));
        } catch (Exception e) {
            return ResponseEntity.badRequest().body(Map.of("message", "Could not post the job. Please try again."));
        }
    }
}
